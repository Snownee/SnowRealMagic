plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "2.+"
}

version = "mc${archive_minecraft_version}-NeoForge-${mod_version}"
group = project.maven_group
var realVersion = project.mod_version + '+neoforge'

base {
    archivesName = project.archives_base_name
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            serverData()
            programArguments = [
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
            ]
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenCentral()
    maven { url "https://maven.parchmentmc.org" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url "https://maven.su5ed.dev/releases" }
    flatDir { dir 'libs' }
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.forgified_fabric_api_version}"

    jarJar "org.sinytra:forgified-fabric-loader:2.5.83+0.19.3+26.1.2"
    jarJar "org.sinytra.forgified-fabric-api:fabric-renderer-api-v1:13.0.8+2ef06a054c"
    jarJar "org.sinytra.forgified-fabric-api:fabric-renderer-indigo:8.1.5+342cbca04c"
    jarJar "org.sinytra.forgified-fabric-api:fabric-block-getter-api-v2:2.0.6+ec56b6014c"
    jarJar "org.sinytra.forgified-fabric-api:fabric-model-loading-api-v1:8.0.11+5d98d6aa4c"
    jarJar "org.sinytra.forgified-fabric-api:fabric-game-rule-api-v1:4.0.5+d871b99e4c"

    implementation 'com.google.errorprone:error_prone_annotations:2.37.0'

    // PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
    // You may need to force-disable transitiveness on them.

    api("maven.modrinth:cloth-config:${project.cloth_config_version}+neoforge")

    //modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    //modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"

    implementation "maven.modrinth:kiwi:${project.kiwi_version}+neoforge"
    annotationProcessor "maven.modrinth:kiwi:${project.kiwi_version}+neoforge"

    implementation "maven.modrinth:jade:${project.jade_version}+neoforge"

//    modRuntimeOnly "curse.maven:minihud-244260:5096818"
//    modRuntimeOnly "curse.maven:malilib-303119:5096807"

    implementation "maven.modrinth:serene-seasons:26.1.2.0.4"
    implementation "maven.modrinth:glitchcore:26.1.2.0.2"
//    implementation("net.jodah:typetools:0.6.3")

//    modImplementation "maven.modrinth:regions-unexplored:A-0.5.6.1+1.21.1"
//    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.2"
//    modImplementation "maven.modrinth:terrablender:yHeHBZPt"

    implementation "maven.modrinth:diagonal-fences:LeJEFOb1"
    implementation "maven.modrinth:diagonal-walls:Z0E1ude9"
    // https://github.com/Fuzss/modresources/tree/main/maven/fuzs/diagonalblocks/diagonalblocks-neoforge/26.1.0
    implementation "fuzs.diagonalblocks:diagonalblocks-neoforge:26.1.0"
    // https://github.com/Fuzss/modresources/tree/main/maven/fuzs/puzzleslib/puzzleslib-fabric
    implementation "fuzs.puzzleslib:puzzleslib-neoforge:26.1.2"

//    compileOnly "maven.modrinth:suggestion-tweaker:1.20.6-1.5.2+fabric"

//    implementation fileTree(dir: "libs", include: ["*.jar"])
//    annotationProcessor fileTree(dir: "libs", include: ["*.jar"])
}


java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaExec).configureEach {
    executable = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }.get().executablePath.asFile.absolutePath
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
//    it.options.compilerArgs.add("-Akiwi.clientOnlyMod")
}

java {
//    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    it.exclude(["/assets/${project.mod_id}/lang/en_us.existing.json",
                "/.cache",
                "**/*.py",
                "**/*.bat",
                "**/*.archive"])
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishMods {
    file = jar.archiveFile
    changelog = file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : ''
    type = ['release': STABLE, 'beta': BETA, 'alpha': ALPHA][release_type]
    modLoaders.add("neoforge")
    displayName = "[NeoForge ${supported_version}] ${mod_version}"
    version = realVersion

    curseforge {
        projectId = "308663"
        client = true
        server = true
        accessToken = providers.environmentVariable("CURSE_TOKEN")
        minecraftVersions.add(minecraft_version)
        minecraftVersions.add("26.1.1")
        minecraftVersions.add("26.1")
        requires("kiwi")
        optional("cloth-config")
    }
    modrinth {
        projectId = "iJNje1E8"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        minecraftVersions.add("26.1.1")
        minecraftVersions.add("26.1")
        requires("kiwi")
        optional("cloth-config")
    }
}